name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.5

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Biome
        run: bun biome:ci

      - name: Foundry lint
        run: bun foundry:lint

      - name: Foundry tests
        run: bun foundry:test

      - name: Cron typecheck
        run: bun --filter @w3s/cron typecheck

      # Wave1 debt: ~90 historical svelte-check errors; tracked non-blocking until Wave2 cleanup.
      # Build remains required (hard-fail).
      - name: SvelteKit check (non-blocking debt)
        continue-on-error: true
        run: bun --filter @w3s/sveltekit check

      - name: SvelteKit build
        run: bun --filter @w3s/sveltekit build

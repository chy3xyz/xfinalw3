name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.5

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Biome
        run: bun biome:ci

      - name: Foundry lint
        run: bun foundry:lint

      - name: Foundry tests
        run: bun foundry:test

      - name: Foundry keystore unit tests
        run: bun --filter @w3s/foundry test:keystore

      - name: Indexer unit tests
        run: bun --filter @w3s/indexer test

      - name: Cron unit tests
        run: bun --filter @w3s/cron test

      - name: Cron typecheck
        run: bun --filter @w3s/cron typecheck

      - name: Solid typecheck
        run: bun --filter @w3s/solid check

      - name: Solid unit tests
        run: bun --filter @w3s/solid test

      - name: Solid i18n check
        run: bun --filter @w3s/solid i18n:check

      - name: Solid build
        env:
          VITE_WALLET_CONNECT_PROJECT_ID: ci-placeholder
          VITE_PROJECT_ID: ci-placeholder
          VITE_USE_RPC_PROXY: "0"
        run: bun --filter @w3s/solid build

      - name: Stack smoke (anvil + deploy + solid headers)
        env:
          SMOKE_INDEXER: "0"
          SMOKE_SOLID: "1"
          SKIP_DEPLOY: "0"
          VITE_WALLET_CONNECT_PROJECT_ID: ci-placeholder
          VITE_PROJECT_ID: ci-placeholder
        run: bun smoke

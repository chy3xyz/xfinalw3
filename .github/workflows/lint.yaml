name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.5

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Biome
        run: bun biome:ci

      - name: Foundry lint
        run: bun foundry:lint

      - name: Foundry tests
        run: bun foundry:test

      - name: Cron typecheck
        run: bun --filter @w3s/cron typecheck

      # Wave1 debt: ~90 historical svelte-check errors; tracked non-blocking until Wave2 cleanup.
      # Build remains required (hard-fail).
      - name: SvelteKit check (non-blocking debt)
        continue-on-error: true
        run: bun --filter @w3s/sveltekit check

      - name: SvelteKit build
        env:
          VITE_PROJECT_ID: ci-placeholder
          VITE_ALCHEMY_API_KEY: ci-placeholder
          PUBLIC_APP_URL: http://127.0.0.1:3000
        run: bun --filter @w3s/sveltekit build

      - name: SvelteKit prod smoke (curl /)
        env:
          VITE_PROJECT_ID: ci-placeholder
          VITE_ALCHEMY_API_KEY: ci-placeholder
          PUBLIC_APP_URL: http://127.0.0.1:3000
          ORIGIN: http://127.0.0.1:3000
          PORT: "3000"
        run: |
          bun --filter @w3s/sveltekit start &
          pid=$!
          cleanup() { kill "$pid" 2>/dev/null || true; wait "$pid" 2>/dev/null || true; }
          trap cleanup EXIT
          for i in $(seq 1 45); do
            if curl -sf -o /dev/null http://127.0.0.1:3000/; then
              echo "smoke ok"
              exit 0
            fi
            sleep 1
          done
          echo "smoke failed: server did not become ready"
          exit 1
